// Standard Expo module build — the expo-module-gradle-plugin applies the Android library +
// Kotlin plugins, wires expo-modules-core, and sets compileSdk/minSdk/namespace. Replaces a
// hand-rolled config that used an undefined safeExtGet() and set no namespace (AGP 8 requires it).
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.caraoke'
version = '0.1.0'

android {
  namespace 'expo.modules.caraoke'

  // AGP 8 / Gradle 9 reads these during configuration even for a library module; without
  // them the build fails with "android.defaultConfig.versionName is not defined".
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
